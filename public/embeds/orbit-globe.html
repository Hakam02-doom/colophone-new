var RAD = Math.PI / 180;
var cv  = document.getElementById('sky');
var ctx = cv.getContext('2d');
var reduced = window.matchMedia &&
              window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ══════════════════════════════════════════════════════════════
   Geometry prep.

   A ring's screen position depends on the spin only through a
   single angle, so the per-point trig is done once here:
     x  =  A·cos(rot) + B·sin(rot)
     z  =  B·cos(rot) − A·sin(rot)
   with A = cos(lat)·sin(lon), B = cos(lat)·cos(lon), y = sin(lat).
   ══════════════════════════════════════════════════════════════ */
function bake(lonLat) {
  var n = lonLat.length / 2;
  var A = new Float32Array(n), B = new Float32Array(n), Y = new Float32Array(n);
  for (var i = 0; i < n; i++) {
    var lon = lonLat[i * 2] * RAD, lat = lonLat[i * 2 + 1] * RAD;
    var cl = Math.cos(lat);
    A[i] = cl * Math.sin(lon);
    B[i] = cl * Math.cos(lon);
    Y[i] = Math.sin(lat);
  }
  return { A: A, B: B, Y: Y, n: n };
}

var rings = LAND.map(bake);

/* graticule: parallels every 30°, meridians every 30° */
var grat = (function () {
  var out = [], lat, lon, pts, i;
  for (lat = -60; lat <= 60; lat += 30) {
    pts = [];
    for (i = 0; i <= 72; i++) pts.push(i * 5 - 180, lat);
    out.push(bake(pts));
  }
  for (lon = -180; lon < 180; lon += 30) {
    pts = [];
    for (i = 0; i <= 36; i++) pts.push(lon, i * 5 - 90);
    out.push(bake(pts));
  }
  return out;
})();

var maxN = rings.reduce(function (m, r) { return Math.max(m, r.n); }, 0);
var PX = new Float64Array(maxN), PY = new Float64Array(maxN), PZ = new Float64Array(maxN);

/* ── frame state, refreshed on resize ─────────────────────────── */
var W = 0, H = 0, cx = 0, cy = 0, R = 0, RO = 0, S = 1;
var COST = Math.cos(CONFIG.tiltDeg * RAD), SINT = Math.sin(CONFIG.tiltDeg * RAD);
var COSI = Math.cos(CONFIG.inclineDeg * RAD), SINI = Math.sin(CONFIG.inclineDeg * RAD);
var COSK = Math.cos(CONFIG.swingDeg * RAD), SINK = Math.sin(CONFIG.swingDeg * RAD);

function resize() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  if (!W || !H) return;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2; cy = H / 2;

  /* Size the globe so the tilted orbit — the widest thing on screen —
     just fits the frame, whatever aspect the embed happens to be.
     The ellipse's half-extents fall straight out of its parametric form. */
  var ampX = Math.sqrt(COSK * COSK + COSI * COSI * SINK * SINK);
  var ampY = Math.sqrt(SINK * SINK + COSI * COSI * COSK * COSK);
  var halfW = Math.max(1, CONFIG.orbitScale * ampX);
  var halfH = Math.max(1, CONFIG.orbitScale * ampY);

  S  = R / 275;                     /* chip metrics were measured at R = 275 */

  var m = Math.sqrt(px * px + py * py) || 1;
  px /= m; py /= m;
  return { sx: cx + px * R, sy: cy - py * R, ang: Math.atan2(-py, px) };
}

function ringPath(ring, cr, sr) {
  var A = ring.A, B = ring.B, Y = ring.Y, n = ring.n;
  var anyVis = false, allVis = true, i;

  for (i = 0; i < n; i++) {
    var x  = A[i] * cr + B[i] * sr;
    var z0 = B[i] * cr - A[i] * sr;
    PX[i] = x;
    PY[i] = Y[i] * COST - z0 * SINT;
    PZ[i] = Y[i] * SINT + z0 * COST;
    if (PZ[i] > 0) anyVis = true; else allVis = false;
  }
  if (!anyVis) return;

  if (allVis) {
    ctx.moveTo(cx + PX[0] * R, cy - PY[0] * R);
    for (i = 1; i < n; i++) ctx.lineTo(cx + PX[i] * R, cy - PY[i] * R);
    ctx.closePath();
    return;
  }

  /* start scanning at the first point that steps into view, so every
     run is bounded by a horizon crossing on both ends */
  var start = -1;
  for (i = 0; i < n; i++) {
    if (PZ[i] <= 0 && PZ[(i + 1) % n] > 0) { start = (i + 1) % n; break; }
  }
  if (start < 0) return;

  var runs = [], cur = null;
  for (var s = 0; s < n; s++) {
    var k = (start + s) % n, prev = (k - 1 + n) % n;
    if (PZ[k] > 0) {
      if (!cur) cur = { entry: boundary(prev, k), pts: [] };
      cur.pts.push(k);
    } else if (cur) {
      cur.exit = boundary(prev, k);
      runs.push(cur); cur = null;
    }
  }
  if (cur) { cur.exit = boundary((start + n - 1) % n, start); runs.push(cur); }
  if (!runs.length) return;

  /* Stitch the runs into closed paths.

     The next run is the one whose entry sits first along the limb
     going anticlockwise from this run's exit — NOT the next run in
     ring order. Linking in ring order makes a single stitch wrap the
     whole circle, which floods the disc with land. */
  var used = new Uint8Array(runs.length);
  for (var s0 = 0; s0 < runs.length; s0++) {
    if (used[s0]) continue;
    var c = s0;
    ctx.moveTo(runs[c].entry.sx, runs[c].entry.sy);
    for (var guard = 0; guard <= runs.length; guard++) {
      used[c] = 1;
      var run = runs[c];
      ctx.lineTo(run.entry.sx, run.entry.sy);
      for (i = 0; i < run.pts.length; i++) {
        var p = run.pts[i];
        ctx.lineTo(cx + PX[p] * R, cy - PY[p] * R);
      }
      ctx.lineTo(run.exit.sx, run.exit.sy);

      var best = -1, bestGap = Infinity;
      for (var j = 0; j < runs.length; j++) {
        var gap = norm(runs[j].entry.ang - run.exit.ang);
        if (gap < bestGap) { bestGap = gap; best = j; }
      }
      ctx.arc(cx, cy, R, run.exit.ang, runs[best].entry.ang, false);
      if (best === s0 || used[best]) break;
      c = best;
    }
    ctx.closePath();
  }
}

function drawGraticule(cr, sr) {
  ctx.beginPath();
  for (var g = 0; g < grat.length; g++) {
    var L = grat[g], pen = false;
    for (var i = 0; i < L.n; i++) {
      var x  = L.A[i] * cr + L.B[i] * sr;
      var z0 = L.B[i] * cr - L.A[i] * sr;
      var y2 = L.Y[i] * COST - z0 * SINT;
      var z2 = L.Y[i] * SINT + z0 * COST;
      if (z2 > 0) {
        var sx = cx + x * R, sy = cy - y2 * R;
        if (pen) ctx.lineTo(sx, sy); else { ctx.moveTo(sx, sy); pen = true; }
      } else pen = false;
    }
  }
  ctx.strokeStyle = PALETTE.graticule;
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawGlobe(rot) {
  var cr = Math.cos(rot), sr = Math.sin(rot);

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.clip();

  var sea = ctx.createRadialGradient(cx - R * .35, cy - R * .4, R * .05, cx, cy, R * 1.25);
  sea.addColorStop(0,   PALETTE.oceanLit);
  sea.addColorStop(.55, PALETTE.oceanMid);
  sea.addColorStop(1,   PALETTE.oceanDim);
  ctx.fillStyle = sea;
  ctx.fillRect(cx - R, cy - R, R * 2, R * 2);

  ctx.beginPath();
  for (var i = 0; i < rings.length; i++) ringPath(rings[i], cr, sr);
  ctx.fillStyle = PALETTE.land;
  ctx.fill();

  drawGraticule(cr, sr);

  /* one shading pass over sea and land together keeps the lighting honest */
  var shade = ctx.createRadialGradient(cx - R * .4, cy - R * .45, R * .1, cx, cy, R * 1.15);
  shade.addColorStop(0, 'rgba(0,0,0,0)');
  shade.addColorStop(.6, 'rgba(0,0,0,.18)');
  shade.addColorStop(1, 'rgba(0,0,0,.62)');
  ctx.fillStyle = shade;
  ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  ctx.restore();

  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.strokeStyle = PALETTE.limb;
  ctx.lineWidth = 1;
  ctx.stroke();
}

/* ══════════════════════════════════════════════════════════════
   Orbit ring + markers

   The ring is a circle tipped by `inclineDeg` and then swung by
   `swingDeg` on screen. z carries the depth, so anything with
   z < 0 that lands inside the disc is drawn before the globe and
   gets covered by it.
   ══════════════════════════════════════════════════════════════ */
function orbitAt(th) {
  var u = Math.cos(th), v = Math.sin(th);
  var y0 = v * COSI, z = v * SINI;
  return {
    sx: cx + (u * COSK - y0 * SINK) * RO,
    sy: cy - (u * SINK + y0 * COSK) * RO,
    z:  z
  };
}

function strokeOrbit(front) {
  var STEPS = 240, pen = false;
  ctx.beginPath();
  for (var i = 0; i <= STEPS; i++) {
    var p = orbitAt(i / STEPS * Math.PI * 2);
    var on = front ? p.z > 0 : p.z <= 0;
    if (on) {
      if (pen) ctx.lineTo(p.sx, p.sy); else { ctx.moveTo(p.sx, p.sy); pen = true; }
    } else pen = false;
  }
  ctx.strokeStyle = front ? PALETTE.orbitNear : PALETTE.orbitFar;
  ctx.lineWidth = 1.6 * S;
  ctx.lineCap = 'round';
  ctx.stroke();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

/* 1 in front of the globe or clear of its silhouette, 0 hidden behind it.
   Fading beats letting the globe slice through the middle of a word. */
function visibility(p) {
  if (p.z > 0) return 1;
  var d = Math.sqrt((p.sx - cx) * (p.sx - cx) + (p.sy - cy) * (p.sy - cy));
  var band = R * 0.07;
  var t = (d - (R - band)) / (band * 2);
  return t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
}

function drawMarker(m, th, alpha) {
  var p = orbitAt(th);
  var box  = 15 * S;            /* the white square that sits on the line */
  var font = 20 * S;
  var padX = 14 * S, padY = 9 * S, gap = 9 * S;

  ctx.font = '500 ' + font.toFixed(1) + 'px "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace';
  ctx.textBaseline = 'middle';
  var tw = ctx.measureText(m.label).width;
  var chipW = tw + padX * 2, chipH = font + padY * 2;

  /* keep the chip on canvas — swap it to the other side near the edge */
  var chipX = p.sx + box / 2 + gap;
  if (chipX + chipW > W - 8 * S) chipX = p.sx - box / 2 - gap - chipW;

  ctx.save();
  ctx.globalAlpha = alpha;

  ctx.fillStyle = PALETTE.marker;
  roundRect(p.sx - box / 2, p.sy - box / 2, box, box, 3.5 * S);
  ctx.fill();

  ctx.fillStyle = m.bg;
  roundRect(chipX, p.sy - chipH / 2, chipW, chipH, 2.5 * S);
  ctx.fill();

  ctx.fillStyle = PALETTE.chipText;
  ctx.fillText(m.label, chipX + padX, p.sy + 0.5 * S);
  ctx.restore();
}

/* ══════════════════════════════════════════════════════════════
   Loop
   ══════════════════════════════════════════════════════════════ */
var t0 = performance.now();

function frame(now) {
  if (!W || !H) { requestAnimationFrame(frame); return; }
  var t = reduced ? 0 : (now - t0) / 1000;
  var rot   = (t / CONFIG.spinSeconds)  * Math.PI * 2;
  var orbit = (t / CONFIG.orbitSeconds) * Math.PI * 2 - 0.35;

  ctx.clearRect(0, 0, W, H);

  /* far side of the ring first — the globe paints over what it hides */
  strokeOrbit(false);
  drawGlobe(rot);
  strokeOrbit(true);

  /* markers ride on top, faded by depth rather than clipped */
  for (var i = 0; i < CONFIG.markers.length; i++) {
    var th = orbit + CONFIG.markers[i].phase;
    var a = visibility(orbitAt(th));
    if (a > 0.004) drawMarker(CONFIG.markers[i], th, a);
  }

  requestAnimationFrame(frame);
}

resize();
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
requestAnimationFrame(frame);
</script>

</body>

        <script type="module">
            let height = 0

            function sendEmbedHeight() {
                window.parent.postMessage({
                    embedHeight: height
                }, "*")
            }

            const observer = new ResizeObserver((entries) => {
                if (entries.length !== 1) return
                const entry = entries[0]
                if (entry.target !== document.body) return

                height = entry.contentRect.height
                sendEmbedHeight()
            })

            observer.observe(document.body)

            window.addEventListener("message", (event) => {
                if (event.source !== window.parent) return
                if (event.data !== "getEmbedHeight") return
                sendEmbedHeight()
            })
        </script>
