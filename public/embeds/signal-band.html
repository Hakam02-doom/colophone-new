        <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colophon — Signal Band</title>
<style>@font-face{font-family:"Geist Mono";font-style:normal;font-weight:100 900;font-display:swap;src:url(/fonts/or3nQ6H-1_WfwkMZI_qYFrcdmg.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}</style>
<style>
/* ============================================================
   Colophon — Signal Band, standalone embed.

   Everything lives in this one file: the SVG lanes, the gradient
   trails, the keywords that ride the lane centrelines, and the
   mosaic hero card. Nothing is fetched except the webfont.

   The 1440 x 300 design canvas is scaled to whatever width the
   embed gets and centred vertically.
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;

  background: transparent;   /* sits on any Framer section colour */
  overflow: hidden;
}

#stage {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

#page {
  position: absolute;
  left: 0; top: 0;
  width: 1440px;
  height: 300px;
  transform-origin: 0 0;
}

/* ── the band ────────────────────────────────────────────────── */

.band {
  position: absolute;
  left: 0; top: 0;
  width: 1440px; height: 300px;   /* squeezed vertically, edge to edge */
}

.band__lanes { stroke-opacity: .4; }   /* whisper-light path outlines */

.t {
  transform: translateX(var(--from));
  animation: flow var(--dur) cubic-bezier(.36,.02,.28,1) var(--delay) infinite;
  will-change: transform;
}
@keyframes flow {
  0%   { transform: translateX(var(--from)); opacity: 0; }
  9%   { opacity: 1; }
  72%  { opacity: 1; }
  100% { transform: translateX(var(--to)); opacity: 0; }
}

/* undistorted 1:1 overlay the riding words live in */
.band-words {
  position: absolute;
  left: 0; top: 0;
  width: 1440px; height: 300px;
  pointer-events: none;
  overflow: visible;
}
.rail-word {
  font-family: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 12px;
  letter-spacing: .09em;
  text-transform: uppercase;
  pointer-events: none;
  text-rendering: geometricPrecision;
}

/* ── product chips ───────────────────────────────────────────── */

.tag {
  position: absolute;
  white-space: nowrap;
  pointer-events: none;
  font-family: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 10px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: #0d0d0d;
  background: #fff;
  border: 1px solid #0d0d0d;
  padding: 5px 6px;
  line-height: 1;
}

/* ── hero card ───────────────────────────────────────────────── */

.hero-card {
  position: absolute;
  left: 616px; top: 22px;
  width: 207px; height: 256px;
  margin: 0;
  background: #fff;
  border: 1px solid #ededef;
}
.hero-card img,
.hero-card canvas {
  position: absolute;
  left: 19px; top: 20px;
  width: 169px; height: 214px;
}
.hero-card canvas { cursor: crosshair; will-change: transform; }

/* ── intro choreography ──────────────────────────────────────
   #page gets .intro at boot, then stage classes in order:
   (card forms) -> .is-flow / .is-tags -> .is-rails
   No JS = no .intro = everything renders complete.            */

.intro .band__lanes { opacity: 0; clip-path: inset(0 50.4% 0 49.6%); }
.intro.is-rails .band__lanes {
  opacity: 1;
  clip-path: inset(0 0 0 0);
  transition: clip-path 1.9s cubic-bezier(.6,0,.16,1), opacity .5s ease;
}

/* trails burst outward from the card centre, lanes 4 -> 3/5 -> 2/6 -> 1/7,
   then the ambient staggered loop takes over invisibly */
.intro .flow { opacity: 0; }
.intro .flow .t { animation-play-state: paused; }
.intro.is-flow .flow { opacity: 1; transition: opacity .5s ease; }
.intro.is-flow .flow .t {
  animation: flow var(--bdur,2.4s) cubic-bezier(.55,.04,.28,.99) var(--bdelay,0s) 1 both;
}
.intro.is-flow .flow > g:nth-child(4) .t { --bdelay: 0s; }
.intro.is-flow .flow > g:nth-child(3) .t,
.intro.is-flow .flow > g:nth-child(5) .t { --bdelay: .12s; }
.intro.is-flow .flow > g:nth-child(2) .t,
.intro.is-flow .flow > g:nth-child(6) .t { --bdelay: .24s; }
.intro.is-flow .flow > g:nth-child(1) .t,
.intro.is-flow .flow > g:nth-child(7) .t { --bdelay: .36s; }

/* chips launch from the card centre and ride the burst to the lane ends */
.intro .tag { opacity: 0; transform: translate(var(--fx,0px), var(--fy,0px)); }
.intro.is-tags .tag {
  opacity: 1;
  transform: translate(0,0);
  transition: transform var(--tdur,1.8s) cubic-bezier(.55,.04,.28,.99) var(--td,0s),
              opacity .45s ease calc(var(--td,0s) + .1s);
}

/* card pulse on the boom */
.intro.is-flow .hero-card { animation: cardBoom .72s cubic-bezier(.34,1.56,.5,1); }
@keyframes cardBoom {
  0%   { transform: scale(1); }
  36%  { transform: scale(1.04); }
  100% { transform: scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  .t { animation: none; opacity: 1; }
  .intro .band__lanes, .intro .flow, .intro .tag {
    opacity: 1; transform: none; clip-path: none; transition: none; animation: none;
  }
}
</style>
</head>

<script>
/* ══════════════════════════════════════════════════════════════
   CONFIG — the only things worth editing
   ══════════════════════════════════════════════════════════════ */
var CONFIG = {
  maxScale:   1.6,     // how far past 1440px wide it may scale up
  intro:      true,    // play the one-time burst on load
  pixelate:   true,    // mosaic formation + hover re-pixelation
  wordEvery:  3100,    // ms between riding keywords; 0 turns them off
  words: [
    'drafts', 'review', 'releases', 'receipts', 'rollback',
    'signal', 'schema', 'webhooks', 'roles', 'audit log', 'preview'
  ],
  wordColors: ['#8a8a90', '#5a9df0', '#9a7af0', '#7ab8a8']
};

var DESIGN_W = 1440, DESIGN_H = 300;
var page = document.getElementById('page');
var stage = document.getElementById('stage');
var reduced = window.matchMedia &&
              window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* NOTE: an IntersectionObserver-based "pause while off-screen" was tried
   here, but browsers intentionally throttle/delay intersection reporting
   for elements inside an iframe (which is what this embed is), which
   caused the animation to spuriously freeze for 1-2s mid-scroll. Removed. */
var onScreen = true;

/* ── scale the design canvas into whatever box the embed gets ── */
(function () {
  var lastW = 0, lastH = 0, queued = false;

  function apply() {
    queued = false;
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    if (w === lastW && h === lastH) return;   /* nothing actually changed */
    lastW = w; lastH = h;
    var s = Math.min(w / DESIGN_W, CONFIG.maxScale);
    page.style.transform = 'scale(' + s + ')';
    page.style.top = ((h - DESIGN_H * s) / 2) + 'px';
  }

  /* Coalesce bursts of resize/ResizeObserver callbacks (mobile browsers
     fire these repeatedly while the address bar hides/shows during
     scroll) into at most one style write per animation frame, so we
     don't stack layout recalcs on top of the browser's own scroll work. */
  function fit() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(apply);
  }

  fit();
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();

/* ══════════════════════════════════════════════════════════════
   Mosaic hero card.

   Chunky pixel cells: black noise at the leading edge, image-colour
   blocks behind it, scattered accent dots. It grows from the card's
   centre on load, dissolves into the sharp image, then re-pixelates
   under the cursor and ripples on click.
   ══════════════════════════════════════════════════════════════ */
(function () {
  var img = document.getElementById('cardSrc');
  var cv = document.getElementById('cardAscii');
  if (!img || !cv) return;

  var W = 197, H = 250, CELL = 9, DPR = 2;
  var COLS = Math.floor(W / CELL), ROWS = Math.floor(H / CELL);
  var OFFX = (W - COLS * CELL) / 2, OFFY = (H - ROWS * CELL) / 2;
  var CX = W / 2, CY = H / 2;
  var MAXD = Math.sqrt(CX * CX + CY * CY);
  var ACCENTS = ['#ff5ca8', '#ffd166', '#7af0c2', '#7abdfc'];

  var ctx = cv.getContext('2d');
  var cells = null, F = null;

  function hash2(x, y) {
    var n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
    return n - Math.floor(n);
  }

  function sample() {
    try {
      var oc = document.createElement('canvas');
      oc.width = COLS; oc.height = ROWS;
      var octx = oc.getContext('2d', { willReadFrequently: true });
      octx.drawImage(img, 0, 0, COLS, ROWS);
      var d = octx.getImageData(0, 0, COLS, ROWS).data;
      cells = new Array(COLS * ROWS);
      F = new Float32Array(COLS * ROWS);
      for (var gy = 0; gy < ROWS; gy++) {
        for (var gx = 0; gx < COLS; gx++) {
          var i = (gy * COLS + gx) * 4;
          var x = OFFX + gx * CELL + CELL / 2;
          var y = OFFY + gy * CELL + CELL / 2;
          cells[gy * COLS + gx] = {
            r: d[i], g: d[i + 1], b: d[i + 2],
            h: hash2(gx, gy), x: x, y: y,
            d: Math.sqrt((x - CX) * (x - CX) + (y - CY) * (y - CY))
          };
        }
      }
      return true;
    } catch (e) {
      return false;   /* cross-origin image -> tainted canvas; skip */
    }
  }

  function blockAt(gx, gy, style, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = style;
    ctx.fillRect(OFFX + gx * CELL, OFFY + gy * CELL, CELL, CELL);
  }

  function dotAt(c, seed) {
    ctx.fillStyle = ACCENTS[(c.h * 977) & 3];
    ctx.fillRect(c.x - 1.2 + (hash2(seed, c.h * 100) - 0.5) * CELL * 0.5,
                 c.y - 1.2 + (hash2(c.h * 100, seed) - 0.5) * CELL * 0.5,
                 2.4, 2.4);
  }

  var ripples = [];
  var hover = { on: false, x: 0, y: 0 };

  function canvasPoint(e) {
    var r = cv.getBoundingClientRect();   /* robust under the page scale */
    return {
      x: (e.clientX - r.left) / r.width * W,
      y: (e.clientY - r.top) / r.height * H
    };
  }

  cv.addEventListener('pointerenter', function () { hover.on = true; wake(); });
  cv.addEventListener('pointerleave', function () { hover.on = false; });
  cv.addEventListener('pointermove', function (e) {
    var p = canvasPoint(e); hover.x = p.x; hover.y = p.y; hover.on = true; wake();
  });
  cv.addEventListener('click', function (e) {
    var p = canvasPoint(e);
    ripples.push({ x: p.x, y: p.y, t0: performance.now(), str: 1.15 });
    if (ripples.length > 5) ripples.shift();
    wake();
  });

  var phase = 'wait';                 /* wait -> form -> fade -> live */
  var formT0 = 0, fadeT0 = 0;
  var FORM_MS = 1500, FADE_MS = 520;

  function drawFormation(p, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#ffffff';        /* opaque plate hides the image */
    ctx.fillRect(0, 0, W, H);

    var blobR = p * MAXD * 1.45;
    var seed = (performance.now() * 0.011) | 0;

    for (var gy = 0; gy < ROWS; gy++) {
      for (var gx = 0; gx < COLS; gx++) {
        var c = cells[gy * COLS + gx];
        var dj = c.d + (c.h * 2 - 1) * 40;        /* ragged edge */
        if (dj >= blobR) continue;
        var rp = (blobR - dj) / 62;
        if (rp < 0.5) {
          if (hash2(gx + seed, gy - seed) < 0.3) continue;
          blockAt(gx, gy, '#0b0b0e', alpha);      /* leading noise edge */
        } else {
          blockAt(gx, gy, 'rgb(' + c.r + ',' + c.g + ',' + c.b + ')', alpha);
        }
        if (rp > 0.25 && c.h > 0.93) { ctx.globalAlpha = alpha; dotAt(c, seed); }
      }
    }
  }

  /* 30fps timer rather than rAF: keeps running in hidden tabs */
  var running = false;
  function schedule() { running = true; setTimeout(draw, 33); }
  function wake() { if (!running) schedule(); }

  function draw() {
    if (!onScreen) return schedule();   /* skip all canvas work while off-screen */

    var now = performance.now();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    if (phase === 'wait') {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);
      return schedule();
    }

    if (phase === 'form') {
      if (!formT0) formT0 = now;
      var p = Math.min(1, (now - formT0) / FORM_MS);
      drawFormation(p, 1);
      if (p >= 1) { phase = 'fade'; fadeT0 = 0; }
      ctx.globalAlpha = 1;
      return schedule();
    }

    if (phase === 'fade') {
      if (!fadeT0) fadeT0 = now;
      var fa = 1 - Math.min(1, (now - fadeT0) / FADE_MS);
      drawFormation(1, fa);            /* mosaic dissolves into the image */
      if (fa <= 0) phase = 'live';
      ctx.globalAlpha = 1;
      return schedule();
    }

    /* live: image at rest, field re-pixelates on hover / click.
       Nothing here needs to run when idle, so once the field has fully
       decayed and there's no hover/ripple, the loop stops rescheduling
       itself entirely instead of burning 30fps forever in the background
       (pointer events call wake() to restart it on demand). */
    var seed = (now * 0.011) | 0;
    for (var k = ripples.length - 1; k >= 0; k--) {
      if ((now - ripples[k].t0) * 0.11 > MAXD * 2.4) ripples.splice(k, 1);
    }

    var anyActive = false;
    for (var i = 0; i < F.length; i++) {
      var c = cells[i];
      var f = F[i] * 0.86;                          /* decay */

      if (hover.on) {
        var hx = c.x - hover.x, hy = c.y - hover.y;
        f = Math.max(f, Math.exp(-(hx * hx + hy * hy) / (2 * 26 * 26)) * 0.95);
      }
      for (var q = 0; q < ripples.length; q++) {
        var rp2 = ripples[q];
        var R = (now - rp2.t0) * 0.11;
        var dx = c.x - rp2.x, dy = c.y - rp2.y;
        var dd = Math.sqrt(dx * dx + dy * dy) - R;
        f = Math.max(f, Math.exp(-(dd * dd) / (2 * 17 * 17)) * rp2.str *
                        Math.max(0, 1 - R / (MAXD * 2.2)));
      }

      F[i] = f;
      if (f < 0.06) continue;
      anyActive = true;

      var gx2 = i % COLS, gy2 = (i / COLS) | 0;
      var black = f > 0.5 && hash2(gx2 + seed, gy2 + seed * 2) < 0.14;
      blockAt(gx2, gy2,
        black ? '#0b0b0e' : 'rgb(' + c.r + ',' + c.g + ',' + c.b + ')',
        Math.min(1, f * 1.6));
      if (f > 0.35 && c.h > 0.93) { ctx.globalAlpha = Math.min(1, f * 1.4); dotAt(c, seed); }
    }
    ctx.globalAlpha = 1;

    if (anyActive || hover.on || ripples.length) return schedule();
    running = false;   /* go to sleep until wake() fires */
  }

  /* ── choreography ─────────────────────────────────────────── */
  function begin() {
    if (!CONFIG.pixelate || !sample()) { cv.style.display = 'none'; return; }
    schedule();

    if (!CONFIG.intro || reduced) { phase = 'live'; return; }
    phase = 'form';
  }

  if (img.complete && img.naturalWidth) begin();
  else img.addEventListener('load', begin);

  if (CONFIG.intro && !reduced) {
    var BURST = 0;   /* everything bursts out immediately together, no lead-in gap */
    page.classList.add('intro');
    requestAnimationFrame(function () {
      page.classList.add('is-flow', 'is-tags', 'is-rails');
    });
    /* hand off to the ambient loop (trails restart at opacity 0, so the
       switch is invisible) */
    setTimeout(function () { page.classList.remove('intro'); }, BURST + 4200);
  }
})();

/* ══════════════════════════════════════════════════════════════
   Ambient keywords riding the lane centrelines, each optionally
   paired with a gradient trail in the same lane and direction.
   ══════════════════════════════════════════════════════════════ */
(function () {
  if (!CONFIG.wordEvery || reduced) return;

  var SVGNS = 'http://www.w3.org/2000/svg';
  var flow = document.querySelector('.flow');
  var wordSvg = document.querySelector('.band-words');
  var lanes = flow ? [].slice.call(flow.children) : [];
  var NEUTRAL = ['gL-sky', 'gR-blue', 'gL-purple', 'gR-yellow'];
  var live = 0;

  function spawnWord(word, color, laneIdx, leftGoing, dur) {
    if (!wordSvg || live > 6) return;

    var t = document.createElementNS(SVGNS, 'text');
    t.setAttribute('class', 'rail-word');
    t.setAttribute('dy', '4');            /* baseline centred in the lane */
    t.setAttribute('fill', color);
    var tp = document.createElementNS(SVGNS, 'textPath');
    tp.setAttribute('href', '#cline' + laneIdx);
    tp.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#cline' + laneIdx);
    tp.setAttribute('startOffset', '50%');
    tp.textContent = word;
    t.appendChild(tp);
    wordSvg.appendChild(t);
    live++;

    /* rAF so it updates every refresh, easing outward from the centre */
    var t0 = performance.now();
    function frame() {
      var p = Math.min(1, (performance.now() - t0) / dur);
      var e = p * p * (3 - 2 * p);        /* smoothstep ~= the trail ease */
      tp.setAttribute('startOffset', (leftGoing ? 50 - e * 50 : 50 + e * 50) + '%');
      t.setAttribute('opacity', p < 0.08 ? p / 0.08 : p > 0.75 ? (1 - p) / 0.25 : 1);
      if (p >= 1) { t.remove(); live--; return; }
      if (document.hidden || !onScreen) setTimeout(frame, 33);
      else requestAnimationFrame(frame);
    }
    frame();
  }

  function spawnTrail(laneIdx, grad, leftGoing, dur) {
    var host = lanes[laneIdx];
    if (!host) return;
    var g = document.createElementNS(SVGNS, 'g');
    var r = document.createElementNS(SVGNS, 'rect');
    r.setAttribute('width', '160');
    r.setAttribute('height', '380');
    r.setAttribute('fill', 'url(#' + grad + ')');
    g.appendChild(r);
    host.appendChild(g);

    var from = leftGoing ? 660 : 680;
    var to = leftGoing ? -360 : 1580;
    var anim = g.animate([
      { transform: 'translateX(' + from + 'px)', opacity: 0 },
      { transform: 'translateX(' + (from + (to - from) * 0.1) + 'px)', opacity: 1, offset: 0.1 },
      { transform: 'translateX(' + to + 'px)', opacity: 0 }
    ], { duration: dur, easing: 'cubic-bezier(.5,.05,.3,1)' });
    anim.onfinish = function () { g.remove(); };
  }

  setInterval(function () {
    if (page.classList.contains('intro') || !onScreen) return;
    var laneIdx = (Math.random() * 7) | 0;
    var leftGoing = Math.random() < 0.5;
    var dur = 4200 + Math.random() * 1400;

    spawnWord(CONFIG.words[(Math.random() * CONFIG.words.length) | 0],
              CONFIG.wordColors[(Math.random() * CONFIG.wordColors.length) | 0],
              laneIdx, leftGoing, dur);

    if (Math.random() < 0.5) {
      var set = NEUTRAL.filter(function (g) {
        return (g.charAt(1) === 'L') === leftGoing;
      });
      if (set.length) spawnTrail(laneIdx, set[(Math.random() * set.length) | 0], leftGoing, dur);
    }
  }, CONFIG.wordEvery);
})();
</script>

        <script type="module">
            let height = 0

            function sendEmbedHeight() {
                window.parent.postMessage({
                    embedHeight: height
                }, "*")
            }

            const observer = new ResizeObserver((entries) => {
                if (entries.length !== 1) return
                const entry = entries[0]
                if (entry.target !== document.body) return

                height = entry.contentRect.height
                sendEmbedHeight()
            })

            observer.observe(document.body)

            window.addEventListener("message", (event) => {
                if (event.source !== window.parent) return
                if (event.data !== "getEmbedHeight") return
                sendEmbedHeight()
            })
        </script>
